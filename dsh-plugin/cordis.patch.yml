# DeepSeek Harness (dsh) bundle patch for better-crawler-4-agent.
#
# One insert over the profile root: an MCP client row that launches this
# package's stdio MCP server (`dsh-plugin/scripts/launch.sh`), so the model
# gets the crawler's tools under a stable namespace:
#
#   mcp__better-crawler__fetch_url
#   mcp__better-crawler__fetch_urls
#   mcp__better-crawler__crawler_status
#
# A stdio MCP row has to name an absolute launcher path, and where pnpm puts a
# package is only known at boot. The `!!js` scalar below is evaluated by the
# Loader when the row activates, against the entry context:
# `ctx.get('profileContext')` carries the running profile's `dir`, so the path
# lands inside this package wherever it was installed. Nothing here needs
# editing after `dsh plugin add` — no install-time placeholder substitution.
#
# `mcp-better-crawler` is an ordinary patch-addressable row: a profile
# cordis.patch.yml or a `--patch` overlay can disable it, retarget `command`,
# or change the timeout without touching this bundle.

- insert:
    - id: mcp-better-crawler
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: better-crawler
        transport: stdio
        command: /bin/sh
        args:
          - !!js 'ctx.get("profileContext").dir + "/node_modules/better-crawler-4-agent-dsh/dsh-plugin/scripts/launch.sh"'
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          BETTER_CRAWLER_TIMEOUT: '25'
          BETTER_CRAWLER_MAX_CHARS: '50000'
        # `fetch_urls` may legitimately run tens of seconds on a batch; the
        # MCP SDK default of 60s would cut long batches short.
        toolCallTimeoutMs: 180000
