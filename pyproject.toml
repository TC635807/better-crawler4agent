[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-crawler-4-agent"
version = "0.1.0"
description = "Turn URLs into clean article text with a real browser. Reliable on JS-heavy and anti-bot sites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.49.0",
    "mcp>=2.0.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "httpx[http2]>=0.27.0",
]

[project.scripts]
better-crawler-mcp = "better_crawler.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/better_crawler"]
