[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-crawler-4-agent"
version = "0.2.0"
description = "Turn URLs into clean article text with a real browser. Reliable on JS-heavy and anti-bot sites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 与浏览器 revision 强绑定：1.61 用 rev 1228，1.62 用 rev 1234。
    # 放宽版本会导致复用已有浏览器时因 revision 不匹配而启动失败。
    "playwright==1.61.0",
    "mcp>=2.0.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "httpx[http2]>=0.27.0",
]

[project.scripts]
better-crawler-mcp = "better_crawler.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/better_crawler"]
